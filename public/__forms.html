<!doctype html>
<!--
  Archivo estático SOLO para que Netlify detecte el formulario "contact" en
  build time (Netlify parsea el HTML del directorio publicado buscando
  forms con el atributo data-netlify). El formulario visible vive en
  src/pages/Contact.tsx y envía por fetch a esta misma ruta. Si agregás o
  renombrás campos allá, reflejalos acá también: Netlify descarta los campos
  que no estén declarados en este form.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Formularios</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
