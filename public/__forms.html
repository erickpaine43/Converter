<!doctype html>
<!--
  Static file whose ONLY purpose is letting Netlify detect the "contact" form
  at build time (Netlify parses the published HTML looking for forms with the
  data-netlify attribute). The visible form lives in src/pages/Contact.tsx and
  submits via fetch to this same path. Fields added or renamed there must be
  mirrored here: Netlify drops any field not declared in this form.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Formularios</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
