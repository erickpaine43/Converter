[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Old tool URLs (English, under /converter/) -> Spanish slugs. 301 to keep
# external links and existing indexing. They go BEFORE the 404 catch-all
# (Netlify applies the first matching rule) and use force in case an old HTML
# file is still at that path. Declared with and without trailing slash so we
# don't depend on how the redirect engine normalizes paths.
# New tools need an entry here and in src/lib/tools.ts (checked by
# src/siteConfig.test.ts).
[[redirects]]
  from = "/converter/merge-pdfs"
  to = "/unir-pdf/"
  status = 301
  force = true
[[redirects]]
  from = "/converter/merge-pdfs/"
  to = "/unir-pdf/"
  status = 301
  force = true
[[redirects]]
  from = "/converter/images-to-pdf"
  to = "/imagenes-a-pdf/"
  status = 301
  force = true
[[redirects]]
  from = "/converter/images-to-pdf/"
  to = "/imagenes-a-pdf/"
  status = 301
  force = true
[[redirects]]
  from = "/converter/pdf-to-images"
  to = "/pdf-a-imagenes/"
  status = 301
  force = true
[[redirects]]
  from = "/converter/pdf-to-images/"
  to = "/pdf-a-imagenes/"
  status = 301
  force = true
[[redirects]]
  from = "/converter/pdf-to-text"
  to = "/pdf-a-texto/"
  status = 301
  force = true
[[redirects]]
  from = "/converter/pdf-to-text/"
  to = "/pdf-a-texto/"
  status = 301
  force = true
[[redirects]]
  from = "/converter/html-to-pdf"
  to = "/html-a-pdf/"
  status = 301
  force = true
[[redirects]]
  from = "/converter/html-to-pdf/"
  to = "/html-a-pdf/"
  status = 301
  force = true

