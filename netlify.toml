# Every valid route is pre-rendered as <route>/index.html (scripts/prerender.mjs),
# so there's no need for the SPA fallback "/* -> /index.html 200", which returned
# 200 with the Home HTML for ANY URL (soft 404).
#
# Without `force`, Netlify serves the static file first if it exists (shadowing)
# and only applies this rule when there's no file: a real 404 with dist/404.html.
# Explicit per-route 200 rules are intentionally not added: they would serve
# /contacto with 200 in addition to /contacto/, duplicating every canonical URL
# (today /contacto -> 301 /contacto/).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
