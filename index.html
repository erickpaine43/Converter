<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Converter — Herramientas PDF gratuitas online</title>
    <!-- Fuentes self-hosted en src/fonts.css (font-display: swap). Sin <link rel="preload">
         a propósito: medido con Slow 4G, precargar los ~168 KB de woff2 compite con el
         CSS/JS y retrasa el FCP/LCP ~300 ms sin mejorar el CLS. -->
    <!-- El banner de cookies viene pre-renderizado: si ya hay respuesta guardada se
         oculta antes del primer paint (clave y clase: src/lib/cookieConsent.ts). -->
    <script>try{var c=localStorage.getItem('cookie-consent');if(c==='accepted'||c==='rejected')document.documentElement.classList.add('cookie-consent-answered')}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
